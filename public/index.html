<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Foto en familia · UTPL</title>
<style>
:root{--navy:#1c4069;--yellow:#f2c142}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--navy);font-family:Montserrat,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:4vmin}
.screen.on{display:flex}
#s-inicio{background:radial-gradient(120% 90% at 30% 20%,#ffd75e,#f2b80f 70%);color:var(--navy)}
#s-inicio img{height:46vmin;max-height:60vh;filter:drop-shadow(0 2vmin 2vmin #0004);animation:hop 1.6s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-2vmin) rotate(1.5deg)}}
h1{font-size:clamp(28px,7vmin,72px);font-weight:800;line-height:1.05;margin:2vmin 0}
.sub{font-size:clamp(16px,2.8vmin,30px);font-weight:600;margin-bottom:3vmin;opacity:.85}
button{font:inherit;cursor:pointer;border:0}
.big{background:var(--navy);color:#fff;font-weight:800;font-size:clamp(24px,5vmin,52px);padding:2.4vmin 7vmin;border-radius:100px;box-shadow:0 1.2vmin 0 #0a2038}
.big:active{transform:translateY(.8vmin);box-shadow:0 .4vmin 0 #0a2038}
.legal{position:absolute;bottom:2vmin;left:4vmin;right:4vmin;font-size:clamp(11px,1.7vmin,16px);opacity:.75}
#s-juego{padding:0;background:#0a1626}
#s-inicio .fr{height:44vh;max-width:70vw;object-fit:contain;filter:drop-shadow(0 1.5vmin 2vmin #0005);animation:none;background:#ffffff55;border-radius:1vmin}
#stage{position:relative;width:min(100vw,66.667vh);aspect-ratio:2/3;background:#fff;overflow:hidden}
#win{position:absolute;left:5.1%;top:10.067%;width:89.7%;height:79.867%;overflow:hidden;background:#000}
#winG,#winP{position:absolute;left:5.1%;top:10.067%;width:89.7%;height:79.867%;overflow:hidden;pointer-events:none}
#winG{z-index:3}#winP{z-index:4}
#ui{position:absolute;inset:0;z-index:7;pointer-events:none}
#ui button{pointer-events:auto}
#win canvas,#winG canvas,#winP canvas{position:absolute;inset:0;width:100%;height:100%}
#frm{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#msg{position:absolute;left:24%;right:2%;top:11%;font-size:clamp(16px,3.2vh,40px);font-weight:800;text-shadow:0 .4vmin 1.2vmin #000a;pointer-events:none}
#msg2{position:absolute;left:0;right:0;top:15%;font-size:clamp(12px,1.8vh,22px);font-weight:700;text-shadow:0 .3vmin 1vmin #000a;pointer-events:none}
#cnt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36vmin;font-weight:900;color:var(--yellow);text-shadow:0 1vmin 3vmin #000a;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}
#s-res{background:linear-gradient(135deg,#16335a,var(--navy))}
.row{display:flex;gap:5vmin;align-items:center;justify-content:center;width:100%;flex-wrap:wrap}
#foto{max-width:58vw;max-height:66vh;border-radius:2vmin;border:1vmin solid #fff;box-shadow:0 2vmin 6vmin #0008}
.qrbox{background:#fff;color:var(--navy);border-radius:2.4vmin;padding:2.4vmin;max-width:34vw}
#qr svg{width:min(26vw,40vh);height:auto;display:block}
.qrbox b{display:block;margin-top:1.2vmin;font-size:clamp(14px,2.6vmin,28px)}
#s-res .big{margin-top:4vmin;background:var(--yellow);color:var(--navy);box-shadow:0 1.2vmin 0 #b88f1d}
#bar{position:absolute;bottom:0;left:0;height:1.2vmin;background:var(--yellow);width:100%;transform-origin:left}
#err{color:#ffd1d1;font-size:clamp(16px,3vmin,30px);margin:2vmin;max-width:80vw}
#dbg{position:fixed;left:6px;bottom:6px;font:11px monospace;opacity:.7;display:none}
@media (orientation:portrait){#foto{max-width:88vw;max-height:44vh}.qrbox{max-width:60vw}#qr svg{width:min(44vw,30vh)}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>

<body>

<div class="screen on" id="s-inicio">
  <img class="fr" src="frame.png" alt="Marco UTPL #VamosLojanos">
  <h1>¡Una foto en familia con el osito!</h1>
  <p class="sub">Vengan todos juntos: papá, mamá, abuelos, hijos. El osito se une al abrazo.</p>
  <button class="big" id="start">Empezar el juego</button>
  <p class="legal">Tu foto se genera solo para que la descargues con un código QR y se elimina automáticamente a las 24 horas. UTPL · Decide ser más.</p>
</div>

<div class="screen" id="s-juego">
  <div id="stage"><div id="win"><canvas id="cv"></canvas></div><img id="frm" src="frame.png" alt=""><div id="winG"><canvas id="gl"></canvas></div><div id="winP"><canvas id="pc"></canvas></div><div id="ui">
    <div id="msg"></div><div id="msg2"></div><button id="shoot" class="big" style="display:none;position:absolute;bottom:11.5%;left:32%;transform:translateX(-50%);font-size:clamp(18px,3.4vmin,36px);padding:1.6vmin 5vmin;white-space:nowrap">Tomar la foto ya</button><div id="cnt"></div><div id="flash"></div></div></div>
</div>

<div class="screen" id="s-res">
  <div class="row">
    <img id="foto" alt="Tu foto">
    <div class="qrbox"><div id="qr"></div><b id="qrtxt">Escanea para descargar tu foto</b></div>
  </div>
  <p id="err" hidden></p>
  <button class="big" id="again">Jugar otra vez</button>
  <div id="bar"></div>
</div>
<div id="dbg"></div>

<script src="audio.js"></script>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
const SIM=Q.get('sim')==='1', DBG=Q.get('dbg')==='1';
if(DBG)$('dbg').style.display='block';
const vid=document.createElement('video');vid.playsInline=true;vid.muted=true;
const cv=$('cv'),cx=cv.getContext('2d');
let stream=null,state='inicio',timers=[],W=897,H=1198;
const FR=new Image();FR.src='frame.png';
const pc=document.getElementById('pc'),pcx=pc.getContext('2d');
let hasMask=0;
let vdw=0,vdh=0,vox=0,voy=0;
function fitVid(){const vw=vid.videoWidth,vh=vid.videoHeight;if(!vw)return;const k=Math.max(W/vw,H/vh);vdw=vw*k;vdh=vh*k;vox=(W-vdw)/2;voy=(H-vdh)/2}
const toStage=(lx,ly)=>({x:W-(vox+lx*vdw),y:voy+ly*vdh});

/* ---------- Escena 3D ---------- */
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setClearColor(0,0);
const scene=new THREE.Scene();
let cam=null;
scene.add(new THREE.HemisphereLight(0xffffff,0x556677,1.1));
const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(-2,5,6);scene.add(sun);

const UNITS=3.9, SH_Y=2.35, L1=1.0, L2=1.0;
const mat=(c,r=.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const FUR=mat(0x8aa0b8),FUR2=mat(0x6f86a0),NAVY=mat(0x1c4069),YEL=mat(0xf2c142),WHITE=mat(0xffffff,.3),DARK=mat(0x15202e,.4);

function limb(len,r,m){const g=new THREE.Mesh(new THREE.CapsuleGeometry(r,len-2*r,6,12),m);g.position.y=-len/2;return g}
function buildPlaceholder(){
  const root=new THREE.Group(),P={};
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(.62,.9,8,16),YEL);body.position.y=1.95;root.add(body);
  const hip=new THREE.Mesh(new THREE.CylinderGeometry(.62,.58,.5,16),NAVY);hip.position.y=1.28;root.add(hip);
  const head=new THREE.Group();head.position.y=3.2;root.add(head);P.head=head;
  head.add(new THREE.Mesh(new THREE.SphereGeometry(.68,24,18),FUR));
  for(const s of[-1,1]){
    const ear=new THREE.Mesh(new THREE.SphereGeometry(.24,12,10),FUR2);ear.position.set(s*.5,.55,0);head.add(ear);
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.15,12,10),WHITE);eye.position.set(s*.25,.12,.58);head.add(eye);
    const pup=new THREE.Mesh(new THREE.SphereGeometry(.075,10,8),DARK);pup.position.set(s*.25,.12,.71);head.add(pup);
  }
  const snout=new THREE.Mesh(new THREE.SphereGeometry(.26,14,10),WHITE);snout.position.set(0,-.16,.58);snout.scale.set(1.1,.8,.8);head.add(snout);
  const nose=new THREE.Mesh(new THREE.SphereGeometry(.09,10,8),DARK);nose.position.set(0,-.07,.8);head.add(nose);
  const lips=new THREE.Mesh(new THREE.SphereGeometry(.16,12,8),mat(0xe0486a,.4));lips.position.set(0,-.34,.66);lips.scale.set(.001,.001,.001);head.add(lips);P.lips=lips;
  for(const s of[-1,1]){const ch=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),mat(0xf08aa0,.9));ch.position.set(s*.42,-.12,.5);ch.scale.set(1,.7,.5);head.add(ch)}
  P.legs=[];for(const s of[-1,1]){const l=new THREE.Group();l.position.set(s*.32,1.1,0);l.add(limb(1.1,.2,FUR));
    const foot=new THREE.Mesh(new THREE.SphereGeometry(.26,12,8),NAVY);foot.scale.set(1,.6,1.4);foot.position.set(0,-1.08,.12);l.add(foot);root.add(l);P.legs.push(l)}
  P.arms=[];for(const s of[-1,1]){
    const up=new THREE.Group();up.position.set(s*.78,SH_Y,0);up.add(limb(L1,.17,FUR));
    const fo=new THREE.Group();fo.position.y=-L1;fo.add(limb(L2,.15,FUR));
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.2,12,10),FUR2);hand.position.y=-L2;fo.add(hand);
    up.add(fo);root.add(up);P.arms.push({up,fo,side:s});
  }
  const tail=new THREE.Group();tail.position.set(0,1.4,-.5);tail.add(limb(1.2,.12,FUR2));tail.rotation.x=-2.2;root.add(tail);P.tail=tail;
  P.root=root;return P;
}
let rig=buildPlaceholder();
const holder=new THREE.Group();holder.add(rig.root);scene.add(holder);
const shadow=new THREE.Mesh(new THREE.CircleGeometry(1.1,24),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.28,depthWrite:false}));
shadow.rotation.x=-Math.PI/2;shadow.scale.set(1,.5,1);holder.add(shadow);

/* GLB oficial opcional: /jaguar.glb o ?glb=ruta */
let glbBaseY=0,mixer=null,clips={walk:null,idle:null},isGLB=false;
async function tryGLB(){
  const url=Q.get('glb');
  try{const h=await fetch(url,{method:'HEAD'});if(!h.ok)return}catch{return}
  try{
    const g=await new GLTFLoader().loadAsync(url);const obj=g.scene;
    const box=new THREE.Box3().setFromObject(obj);const hgt=box.max.y-box.min.y||1;
    const k=UNITS/hgt;obj.scale.setScalar(k);obj.position.y=-box.min.y*k;glbBaseY=obj.position.y;obj.userData.sx=obj.userData.sy=obj.userData.sz=k;
    holder.remove(rig.root);rig.root=obj;holder.add(obj);isGLB=true;
    mixer=new THREE.AnimationMixer(obj);
    for(const c of g.animations){const a=mixer.clipAction(c);
      if(/walk|camin/i.test(c.name))clips.walk=a;else if(/idle|stand|repos|wait/i.test(c.name))clips.idle=a}
    if(!clips.idle&&g.animations[0])clips.idle=mixer.clipAction(g.animations[0]);
    (clips.idle||{play(){}}).play();
  }catch(e){console.warn('GLB no cargado',e)}
}
if(Q.get('glb'))tryGLB();

/* ---------- Seguimiento de la persona ---------- */
let person=null;       // {tx,ty,sw} en px de pantalla (ya espejado), suavizado
let lastSeen=0,seenFrames=0;
let pose=null,poseBusy=false;
function initPose(){
  try{
    pose=new Pose({locateFile:f=>'vendor/pose/'+f});
    pose.setOptions({modelComplexity:0,smoothLandmarks:true,enableSegmentation:true,smoothSegmentation:true,minDetectionConfidence:.5,minTrackingConfidence:.5});
    pose.onResults(r=>{
      if(r.segmentationMask)personLayer(r.segmentationMask,r.image||vid);
      const L=r.poseLandmarks;if(!L){seenFrames=0;return}
      const a=L[11],b=L[12];if(!a||!b||a.visibility<.5||b.visibility<.5){seenFrames=0;return}
      const pa=toStage(a.x,a.y),pb=toStage(b.x,b.y),xa=pa.x,xb=pb.x,ya=pa.y,yb=pb.y;
      const sl=xa<xb?{x:xa,y:ya}:{x:xb,y:yb}, sr=xa<xb?{x:xb,y:yb}:{x:xa,y:ya};
      const wr=[L[15],L[16]].filter(Boolean).map(w=>{const q=toStage(w.x,w.y);return {x:q.x,y:q.y,v:w.visibility||0}});
      feed({sl,sr,wr});
    });
  }catch(e){console.warn('pose',e);pose=null}
}
function personLayer(mask,img){
  pcx.save();pcx.clearRect(0,0,W,H);pcx.translate(W,0);pcx.scale(-1,1);
  const x=W-vox-vdw;
  pcx.drawImage(mask,x,voy,vdw,vdh);pcx.globalCompositeOperation='source-in';pcx.drawImage(img,x,voy,vdw,vdh);
  pcx.restore();hasMask=performance.now()}
function feed({sl,sr,wr}){
  const sw=Math.max(40,sr.x-sl.x);
  const n={slx:sl.x,sly:sl.y,srx:sr.x,sry:sr.y,sw};
  if(!person)person=n;else for(const k in n)person[k]+=(n[k]-person[k])*.35;
  if(wr)person.wr=wr;
  lastSeen=performance.now();seenFrames++;
}
function trackLoop(){
  if(state==='juego'||state==='cuenta'){
    if(SIM){simStep()}
    else if(pose&&!poseBusy&&vid.videoWidth){poseBusy=true;pose.send({image:vid}).catch(()=>{}).finally(()=>poseBusy=false)}
  }
  setTimeout(trackLoop,66);
}
function simStep(){const t=(performance.now()-t0)/1000;
  const cxp=W*(.5+.04*Math.sin(t*.6)),y=H*.5,sw=W*.3;
  const up=Math.sin(t*.8)>-.2;
  feed({sl:{x:cxp-sw/2,y},sr:{x:cxp+sw/2,y},wr:[{x:cxp+sw*.75,y:up?y-sw*.8:y+sw*1.6,v:1}]})}

/* ---------- Partículas (corazones / estrellas) ---------- */
function mkTex(draw){const c=document.createElement('canvas');c.width=c.height=64;draw(c.getContext('2d'));return new THREE.CanvasTexture(c)}
const TEX={
  heart:mkTex(g=>{g.fillStyle='#ff4d6d';g.beginPath();g.moveTo(32,56);g.bezierCurveTo(4,36,6,10,22,10);g.bezierCurveTo(28,10,32,16,32,20);g.bezierCurveTo(32,16,36,10,42,10);g.bezierCurveTo(58,10,60,36,32,56);g.fill()}),
  star:mkTex(g=>{g.fillStyle='#ffd23f';g.beginPath();for(let i=0;i<10;i++){const r=i%2?12:28,a=-Math.PI/2+i*Math.PI/5;g.lineTo(32+r*Math.cos(a),32+r*Math.sin(a))}g.closePath();g.fill()})
};
const parts=[];
function spawn(kind,pos,vel,size,life=1.1){
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX[kind],transparent:true,depthTest:false}));
  sp.position.copy(pos);sp.position.z=50;sp.scale.set(size,size,1);scene.add(sp);
  parts.push({sp,vel,life,max:life,size});
}
function stepParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;
    if(p.life<=0){scene.remove(p.sp);p.sp.material.dispose();parts.splice(i,1);continue}
    p.sp.position.x+=p.vel.x*dt;p.sp.position.y+=p.vel.y*dt;
    const k=p.life/p.max;p.sp.material.opacity=Math.min(1,k*2.2);const sz=p.size*(1.25-.25*k);p.sp.scale.set(sz,sz,1)}
}

/* ---------- Juego ---------- */
let playStart=0,nextJump=0,jumpT0=-1e9,nearT=0,seq=[],burstDone=false,kissT=0;
const PLAY=15,ACT_MS=3000;
const MSGS={abrazo:'¡Un abrazo en familia! 🤗',choca5:'¡Choca esos cinco! 🙌',beso:'¡Muac! 😘',baile:'¡A bailar! 💃',flex:'¡Mira mis músculos! 💪',saludo:'¡Hola, hola! 👋',giro:'¡Wiii! 🌀'};
function startSeq(){if(Q.get('seq')){seq=Q.get('seq').split(',');return}seq=['abrazo',...['choca5','beso','baile','flex','saludo','giro'].sort(()=>Math.random()-.5).slice(0,4)]}
let t0=0,lastT=0,jx=0,vx=0,fallback=false,counting=false,yaw=0;
const WALKS=1.6, clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t, sstep=u=>u*u*(3-2*u);
let curSide=-1;
function placeFor(p){
  const feetY=H*.97;
  const roomR=W-p.srx, roomL=p.slx;
  let side=curSide; if(side===-1&&roomL<W*.2&&roomR>roomL*1.4)side=1; else if(side===1&&roomR<W*.2&&roomL>roomR*1.4)side=-1; curSide=side;
  const tgt=side===1?{x:p.srx,y:p.sry-p.sw*.12}:{x:p.slx,y:p.sly-p.sw*.12};
  let sc=(feetY-tgt.y)/SH_Y*.95; sc=clamp(sc,H*.2/UNITS,H*.72/UNITS);
  const room=side===1?(W*.985-tgt.x):(tgt.x-W*.015);
  sc=Math.min(sc,room/3.4);
  return {side,tgt,sc,feetY,jxT:tgt.x+side*2.45*sc};
}
const W3=(x,y)=>new THREE.Vector3(x,H-y,0);
function ikArm(A,tw){
  const loc=rig.root.worldToLocal(tw.clone());
  const sx=A.up.position.x,sy=A.up.position.y;
  const dx=loc.x-sx,dy=loc.y-sy;let d=Math.hypot(dx,dy);
  d=clamp(d,.25,(L1+L2)*.995);
  const base=Math.atan2(dy,dx),ang=Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1));
  const c1=base+ang,c2=base-ang,ey=a=>sy+L1*Math.sin(a);
  const a1=ey(c1)<ey(c2)?c1:c2;
  const ex=sx+L1*Math.cos(a1),eyy=sy+L1*Math.sin(a1);
  const a2=Math.atan2(dy+sy-eyy,dx+sx-ex);
  return [a1+Math.PI/2,a2-a1];
}
// Control de cada acción: devuelve poses de brazos y cuerpo
function actionCtrl(name,u,e,el,c){
  const o={lean:0,hop:0,spin:0,lips:0,near:null,far:null,legs:0},s=c.side,ns=-s;
  switch(name){
    case 'abrazo': o.near={ik:c.shoulderW,w:e};o.lean=s*.1*e;break;
    case 'choca5': o.near={ik:c.handW,w:e};o.lean=s*.05*e;
      if(u>.45&&!burstDone){burstDone=true;SFX.clap();const hp=c.handW.clone();
        for(let i=0;i<10;i++){const a=i/10*Math.PI*2;spawn('star',hp,new THREE.Vector3(Math.cos(a)*c.sc*1.6,Math.sin(a)*c.sc*1.6,0),c.sc*.45,.8)}}
      break;
    case 'beso': o.near={ik:c.shoulderW,w:e*.8};o.lean=s*.2*e;o.lips=e;break;
    case 'baile': {const b=Math.sin(el*10);o.hop=Math.abs(Math.sin(el*9))*.35*e;o.lean=Math.sin(el*5)*.12*e;o.legs=Math.sin(el*9)*.5*e;
      o.near={z:[ns*(2.3+.4*b),0],w:e};o.far={z:[s*(2.3+.4*Math.sin(el*10+3)),0],w:e};break}
    case 'flex': {const pp=Math.sin(el*8)*.15;o.near={z:[ns*1.57,ns*(1.5+pp)],w:e};o.far={z:[s*1.57,s*(1.5+pp)],w:e};break}
    case 'saludo': o.far={z:[s*2.5,s*Math.sin(el*14)*.5],w:e};o.lean=Math.sin(el*3)*.06*e;break;
    case 'giro': o.spin=Math.PI*2*sstep(u);o.hop=Math.sin(Math.PI*u)*.8;break;
  }
  return o;
}
function frame(now){
  requestAnimationFrame(frame);
  if(state!=='juego'&&state!=='cuenta')return;
  const dt=Math.min(.05,(now-lastT)/1000||.016);lastT=now;
  const el=(now-t0)/1000;
  const seen=person&&now-lastSeen<1200&&(seenFrames>=4||SIM);
  if(!seen&&!fallback&&el>WALKS+5){fallback=true;person={slx:W*.2,sly:H*.52,srx:W*.5,sry:H*.52,sw:W*.3}}
  const have=seen||fallback;
  const T=have?placeFor(person):{side:1,tgt:{x:W*.5,y:H*.5},sc:H*.82/UNITS,feetY:H*.97,jxT:W+H*.4};
  const sc=T.sc,side=T.side;
  if(jx===0)jx=side===1?-H*.5:W+H*.5;
  const maxV=W*.28,want=(T.jxT-jx)*3;
  vx+=(clamp(want,-maxV,maxV)-vx)*Math.min(1,dt*6);jx+=vx*dt;
  const speed=Math.abs(vx)/maxV,walking=speed>.12;
  const near=Math.abs(T.jxT-jx)<sc*.7&&have;
  nearT=near?nearT+dt:0;
  if(!playStart&&!counting&&nearT>.6){playStart=now;nextJump=now+2500;startSeq();$('shoot').style.display='block'}
  // acción actual
  let act=null,u=0,e=0,idx=0;
  if(playStart&&!counting){
    const tt=now-playStart;idx=Math.min(Math.floor(tt/ACT_MS),seq.length-1);act=seq[idx];
    u=clamp((tt-idx*ACT_MS)/ACT_MS,0,1);e=Math.min(1,u*5,(1-u)*5);
    if(idx!==seqIdxShown){seqIdxShown=idx;burstDone=false;kissT=0;$('msg').textContent=MSGS[act];({abrazo:SFX.hug,choca5:SFX.hello,beso:SFX.kiss,baile:SFX.boing,flex:SFX.flex,saludo:SFX.hello,giro:SFX.whoosh})[act]()}
    const left=Math.ceil(PLAY-tt/1000);
    $('msg2').textContent='Foto en '+Math.max(left,0)+' s · ¡juntitos, toda la familia!';
    if(left<=0)shoot();
  }
  // datos del contexto
  const p=person||{slx:0,sly:0,srx:0,sry:0,sw:100};
  const shoulderW=W3(T.tgt.x,T.tgt.y);
  const headW=W3((p.slx+p.srx)/2,(p.sly+p.sry)/2-p.sw*.55);
  let handW=W3(T.tgt.x+side*p.sw*.9,T.tgt.y-p.sw*1.0);
  if(p.wr){const cand=p.wr.filter(w=>w.v>.5&&w.y<(p.sly+p.sry)/2).sort((a,b)=>side*(b.x-a.x));
    if(cand.length&&now-lastSeen<600)handW=W3(cand[0].x,cand[0].y)}
  const ctx={side,sc,shoulderW,headW,handW};
  const o=act?actionCtrl(act,u,e,el,ctx):{lean:0,hop:0,spin:0,lips:0,near:null,far:null,legs:0};
  // salto por toque
  const jp=(now-jumpT0)/700,jOff=jp<1?Math.sin(Math.PI*jp)*.9:0;
  if(playStart&&!counting&&!act&&now>nextJump)jumpT0=now;
  // pose del cuerpo
  const yawT=walking&&!near?Math.sign(vx||1)*.95:-side*.28;
  yaw+=(yawT-yaw)*Math.min(1,dt*5);
  holder.position.set(jx,H-T.feetY+(o.hop+jOff)*sc,0);holder.scale.setScalar(sc);shadow.position.y=-(o.hop+jOff);
  rig.root.rotation.y=yaw+o.spin;rig.root.rotation.z=o.lean;
  holder.updateMatrixWorld(true);
  const ph=el*(6+speed*4);
  if(!isGLB){
    const sw=walking?Math.sin(ph)*.7*Math.min(1,speed*2):0;
    rig.legs[0].rotation.x=sw+o.legs;rig.legs[1].rotation.x=-sw-o.legs;
    rig.root.position.y=walking?Math.abs(Math.sin(ph))*.07:Math.sin(el*2)*.015;
    // cabeza: mira a la persona; en el beso se acerca
    const look=clamp((headW.x-jx)/(W*.3),-1,1)*(near?.55:.35);
    rig.head.rotation.y=look;rig.head.rotation.z=Math.sin(el*1.7)*.03+(act==='saludo'?Math.sin(el*3)*.1*e:0)+(-side)*-.0;
    let hx=0,hy=3.2;
    if(o.lips>0){const lh=rig.root.worldToLocal(headW.clone());let dx=lh.x,dy=lh.y-3.2;const L=Math.hypot(dx,dy)||1;const m=Math.min(L*.5,1.0)*o.lips;hx=dx/L*m;hy=3.2+dy/L*m*.5;rig.head.rotation.z+=side*.3*o.lips;rig.head.rotation.y=lerp(rig.head.rotation.y,-side*.5,o.lips)}
    rig.head.position.set(hx,hy,0);
    const ls=Math.max(.001,o.lips);rig.lips.scale.set(ls,ls*.8,ls);
    if(o.lips>.6){kissT-=dt;if(kissT<=0){kissT=.22;const lp=new THREE.Vector3();rig.lips.getWorldPosition(lp);
      const dir=headW.clone().sub(lp);dir.z=0;dir.normalize();
      spawn('heart',lp,new THREE.Vector3(dir.x*sc*2.2+(Math.random()-.5)*sc*.6,dir.y*sc*2.2+sc*.8,0),sc*.5,1.1)}}
    rig.tail.rotation.z=Math.sin(el*(walking?8:3))*.35;
    for(const A of rig.arms){
      const isNear=A.side===-side;
      const swing=walking?Math.sin(ph+(A.side>0?0:Math.PI))*.6*Math.min(1,speed*2):Math.sin(el*1.6+A.side)*.04;
      let upZ=A.side*.08,upX=swing,foZ=0;
      const spec=isNear?o.near:o.far;
      if(spec){const w=spec.w;let tz,tf;
        if(spec.ik){[tz,tf]=ikArm(A,spec.ik)}else{[tz,tf]=spec.z}
        upZ=lerp(upZ,tz,w);foZ=lerp(foZ,tf,w);upX=upX*(1-w)}
      A.up.rotation.z=upZ;A.up.rotation.x=upX;A.fo.rotation.z=foZ;
    }
  }else{
    // modelo GLB: con animaciones usa el mezclador; sin esqueleto, movimiento de cuerpo entero
    if(mixer){mixer.update(dt);
      if(clips.walk&&clips.idle){const w=walking?1:0;clips.walk.setEffectiveWeight(w);clips.idle.setEffectiveWeight(1-w);if(w&&!clips.walk.isRunning())clips.walk.play()}}
    if(!clips.walk){
      rig.root.position.y=glbBaseY+(walking?Math.abs(Math.sin(ph))*.12:Math.sin(el*2)*.02);
      rig.root.rotation.z=o.lean+(walking?Math.sin(ph)*.06:0)+(act==='baile'?Math.sin(el*8)*.14*e:0)+(act==='saludo'?Math.sin(el*14)*.08*e:0);
      const pump=act==='flex'?Math.sin(el*10)*.05*e:0;rig.root.scale.set((rig.root.userData.sx||1)*(1+pump),(rig.root.userData.sy||1)*(1-pump*.5),(rig.root.userData.sz||1)*(1+pump));
    }
  }
  stepParts(dt);
  // render 2D + 3D
  cx.fillStyle='#000';cx.fillRect(0,0,W,H);
  if(vid.videoWidth){cx.save();cx.translate(W,0);cx.scale(-1,1);cx.drawImage(vid,W-vox-vdw,voy,vdw,vdh);cx.restore()}
  if(SIM)drawDummy();
  renderer.render(scene,cam);
  if(DBG)$('dbg').textContent=`seen=${!!seen} fb=${fallback} act=${act} u=${u.toFixed(2)} sc=${sc.toFixed(0)}`;
}
let seqIdxShown=-1;
function drawDummy(){ pcx.clearRect(0,0,W,H);if(!person)return;const p=person;
  for(const g of[cx,pcx]){g.save();g.fillStyle='#3b4a63';
  g.beginPath();g.roundRect(p.slx-p.sw*.1,p.sly,p.sw*1.2,H,p.sw*.3);g.fill();
  g.fillStyle='#d9b08c';g.beginPath();g.arc((p.slx+p.srx)/2,p.sly-p.sw*.62,p.sw*.42,0,7);g.fill();g.restore()}}

function resize(){
  cv.width=W;cv.height=H;pc.width=W;pc.height=H;renderer.setPixelRatio(1);renderer.setSize(W,H,false);
  cam=new THREE.OrthographicCamera(0,W,H,0,-5000,5000);cam.position.z=1000;
  
}
function shoot(){if(counting)return;counting=true;$('shoot').style.display='none';count(3)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}

async function startGame(){
  SFX.init();
  $('err').hidden=true;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){alert('No se pudo abrir la cámara. Revisa el permiso de cámara del navegador y vuelve a intentar.');return}
  vid.srcObject=stream;await vid.play();
  await new Promise(r=>{if(vid.videoWidth)r();else vid.onloadedmetadata=r});
  W=897;H=1198;resize();fitVid();
  playStart=0;nearT=0;seqIdxShown=-1;burstDone=false;$('msg2').textContent='';$('shoot').style.display='none';person=null;curSide=-1;jx=0;pcx.clearRect(0,0,W,H);seenFrames=0;lastSeen=0;fallback=false;counting=false;vx=0;jx=0;yaw=0;
  if(!pose&&!SIM)initPose();
  show('s-juego');state='juego';SFX.start();SFX.music(true);t0=performance.now();lastT=t0;
  $('msg').textContent='¡Párate frente a la cámara!';$('cnt').textContent='';
  later(()=>{if(state==='juego'&&!counting&&!playStart)$('msg').textContent='¡Mira quién viene!'},1500);
}
function count(n){
  if(state!=='juego'&&state!=='cuenta')return;
  state='cuenta';
  if(n>0){SFX.tick(n);$('cnt').textContent=n;$('msg').textContent='¡Sonríe!';later(()=>count(n-1),1000)}
  else{$('cnt').textContent='';SFX.tick(0);snap()}
}
async function snap(){
  const out=document.createElement('canvas');out.width=1000;out.height=1500;const c=out.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,1000,1500);
  c.drawImage(cv,51,151,897,1198);renderer.render(scene,cam);c.drawImage($('gl'),51,151,897,1198);c.drawImage(pc,51,151,897,1198);c.drawImage(FR,0,0,1000,1500);
  SFX.done();SFX.music(false);
  $('flash').style.transition='none';$('flash').style.opacity=1;
  requestAnimationFrame(()=>{$('flash').style.transition='opacity .45s';$('flash').style.opacity=0});
  state='res';stopCam();
  const data=out.toDataURL('image/jpeg',0.9);
  $('foto').src=data;$('qr').replaceChildren();$('qrtxt').textContent='Generando tu código QR…';
  await new Promise(r=>setTimeout(r,500));
  show('s-res');upload(data);resetTimer();
}
async function upload(data,intento=1){
  try{
    const r=await fetch('/api/foto',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({img:data})});
    if(!r.ok)throw new Error(r.status);
    const {id}=await r.json();
    const q=qrcode(0,'M');q.addData(location.origin+'/f/'+id);q.make();
    $('qr').innerHTML=q.createSvgTag({cellSize:6,margin:0,scalable:true});
    $('qrtxt').textContent='Escanea para descargar tu foto';$('err').hidden=true;
  }catch(e){
    if(intento<3){setTimeout(()=>upload(data,intento+1),1200);return}
    $('qrtxt').textContent='Sin conexión';$('err').hidden=false;
    $('err').textContent='No se pudo generar el QR. Pulsa "Jugar otra vez" e inténtalo de nuevo.';
  }
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}vid.srcObject=null}
function resetTimer(){
  const b=$('bar');b.style.transition='none';b.style.transform='scaleX(1)';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.transition='transform 45s linear';b.style.transform='scaleX(0)'}));
  later(home,45000);
}
function home(){SFX.music(false);clearTimers();stopCam();state='inicio';show('s-inicio')}
$('start').onclick=startGame;
$('shoot').onclick=e=>{e.stopPropagation();shoot()};
$('stage').addEventListener('pointerdown',()=>{SFX.sparkle();if(playStart&&!counting){jumpT0=performance.now();const hp=holder.position.clone();hp.y+=holder.scale.x*3.6;for(let i=0;i<8;i++){const a=i/8*Math.PI*2;spawn('star',hp,new THREE.Vector3(Math.cos(a)*holder.scale.x*1.5,Math.sin(a)*holder.scale.x*1.5,0),holder.scale.x*.4,.7)}}});
$('again').onclick=()=>{SFX.music(false);clearTimers();stopCam();state='inicio';startGame()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state!=='inicio')home()});
resize();requestAnimationFrame(frame);trackLoop();
window.__dbg={get state(){return state}};
</script>
